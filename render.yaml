# Render Blueprint — Cortex-Site
# https://render.com/docs/blueprint-spec
# Secrets are NEVER stored in this file; set them in Render environment settings.

services:
  - type: web
    name: cortex-site
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    healthCheckPath: /api/health
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CORTEX_EMAIL_MODE
        value: resend
      - key: CORTEX_CONTACT_TO_EMAIL
        sync: false
      - key: CORTEX_CONTACT_EMAIL_FROM
        sync: false
      - key: CORTEX_WAITLIST_TO_EMAIL
        sync: false
      - key: CORTEX_EMAIL_FROM
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_MODEL
        value: llama3
      - key: WORKFLO_WAITLIST_FILE
        value: data/waitlist.json
      - key: CORTEX_CONTACT_FILE
        value: data/contacts.json
      - key: CORTEX_DEMO_FILE
        value: data/demos.json
      - key: CORTEX_NEWSLETTER_FILE
        value: data/newsletter.json
      - key: CORTEX_ANALYTICS_FILE
        value: data/analytics.json
